<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso REST - Empleados</title>
    <!-- Comparte el mismo diseño que Thymeleaf. -->
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/login.js" defer></script>
</head>
<body>
<main class="page">
    <h1>Iniciar sesión - REST</h1>
    <!-- JS intercepta el envío y utiliza fetch POST /api/login. -->
    <form class="card login-card" id="formLogin">
        <label for="login">Usuario:</label>
        <input id="login" name="login" type="text" autocomplete="username" required>
        <label for="password">Contraseña:</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
        <p id="mensajeError" class="error-message" role="alert" aria-live="polite"></p>
    </form>
</main>
</body>
</html>
